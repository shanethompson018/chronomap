<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <g id="pin"><circle r="14" fill="#4f8cff" stroke="#fff" stroke-width="2.5"/><text text-anchor="middle" dy="5" font-size="13">👤</text></g>
    <g id="bReas"><circle r="8" fill="#3fae5e" stroke="#fff" stroke-width="1.5"/><text text-anchor="middle" dy="3.5" font-size="10" font-weight="700" fill="#fff">✓</text></g>
  </defs>
  <rect width="900" height="470" fill="#e8e2d0"/>
  <!-- faint map detail so the fade is judged against something -->
  <g stroke="#cdb99a" stroke-width="1" fill="none" opacity="0.8">
    <path d="M0,80 C150,60 250,120 400,90 S700,60 900,100"/><path d="M0,300 C200,280 300,340 500,310 S750,280 900,330"/>
    <path d="M120,0 C130,150 90,300 140,470"/><path d="M660,0 C640,160 700,300 650,470"/>
  </g>
  <text x="20" y="30" font-size="16" font-weight="700" fill="#222">A. Where someone was, known only to a range (at Port Royal 1730 – 1744, most likely 1736)</text>
  <text x="20" y="50" font-size="12" fill="#444">Presence is least likely at the ends and most likely in the middle: 60% → 75% → 60%.</text>
  <line x1="80" y1="150" x2="820" y2="150" stroke="#777" stroke-width="1.5"/>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="110" y="175">1730</text><text x="110" y="189" fill="#666">earliest · 60%</text>
    <text x="250" y="175">1733</text><text x="250" y="189" fill="#666">68%</text>
    <text x="390" y="175">1736</text><text x="390" y="189" fill="#666">most likely · 75%</text>
    <text x="530" y="175">1740</text><text x="530" y="189" fill="#666">68%</text>
    <text x="670" y="175">1744</text><text x="670" y="189" fill="#666">latest · 60%</text>
    <text x="790" y="175">1745</text><text x="790" y="189" fill="#666">gone</text>
  </g>
  <g opacity="0.60"><use href="#pin" x="110" y="120"/></g><use href="#bReas" x="122" y="108"/>
  <g opacity="0.68"><use href="#pin" x="250" y="120"/></g><use href="#bReas" x="262" y="108"/>
  <g opacity="0.75"><use href="#pin" x="390" y="120"/></g><use href="#bReas" x="402" y="108"/>
  <g opacity="0.68"><use href="#pin" x="530" y="120"/></g><use href="#bReas" x="542" y="108"/>
  <g opacity="0.60"><use href="#pin" x="670" y="120"/></g><use href="#bReas" x="682" y="108"/>

  <text x="20" y="250" font-size="16" font-weight="700" fill="#222">B. An Appears date known only to a range (born 1700 – 1705, most likely 1702)</text>
  <text x="20" y="270" font-size="12" fill="#444">Once past the latest date the person is certainly alive, so the fade climbs to 100% and stays there: 60% → 75% → 100%.</text>
  <line x1="80" y1="370" x2="820" y2="370" stroke="#777" stroke-width="1.5"/>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="110" y="395">1699</text><text x="110" y="409" fill="#666">not yet</text>
    <text x="250" y="395">1700</text><text x="250" y="409" fill="#666">earliest · 60%</text>
    <text x="390" y="395">1702</text><text x="390" y="409" fill="#666">most likely · 75%</text>
    <text x="530" y="395">1704</text><text x="530" y="409" fill="#666">88%</text>
    <text x="670" y="395">1705</text><text x="670" y="409" fill="#666">latest · 100%</text>
    <text x="790" y="395">1720</text><text x="790" y="409" fill="#666">100%</text>
  </g>
  <g opacity="0.60"><use href="#pin" x="250" y="340"/></g><use href="#bReas" x="262" y="328"/>
  <g opacity="0.75"><use href="#pin" x="390" y="340"/></g><use href="#bReas" x="402" y="328"/>
  <g opacity="0.88"><use href="#pin" x="530" y="340"/></g><use href="#bReas" x="542" y="328"/>
  <use href="#pin" x="670" y="340"/><use href="#bReas" x="682" y="328"/>
  <use href="#pin" x="790" y="340"/><use href="#bReas" x="802" y="328"/>
  <text x="20" y="450" font-size="12" fill="#444">A Disappears range runs the same way in reverse: 100% until its earliest date, 75% at most likely, 60% at latest, then gone. An exact date is always 100%.</text>
</svg>
