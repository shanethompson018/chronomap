<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="400" viewBox="0 0 1140 400" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <filter id="fuzz" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
    <clipPath id="p1"><rect x="10" y="40" width="360" height="300"/></clipPath>
    <clipPath id="p2"><rect x="390" y="40" width="360" height="300"/></clipPath>
    <clipPath id="p3"><rect x="770" y="40" width="360" height="300"/></clipPath>
  </defs>
  <rect width="1140" height="400" fill="#f6f3ec"/>

  <!-- ===== Panel 1: whole area approximate ===== -->
  <text x="10" y="26" font-size="16" font-weight="700" fill="#222">1. Whole outline is a best guess</text>
  <g clip-path="url(#p1)">
    <rect x="10" y="40" width="360" height="300" fill="#e8e2d0"/>
    <path d="M300,40 C285,130 320,210 295,340 L370,340 L370,40 Z" fill="#a9c7e8"/>
    <polyline points="60,40 85,120 70,200 95,340" fill="none" stroke="#6fa3d8" stroke-width="3"/>
    <!-- fuzzy band = uncertainty of the whole edge -->
    <polygon points="110,90 230,70 300,150 270,240 170,275 95,215" fill="none" stroke="#c0392b" stroke-width="26" opacity="0.22" filter="url(#fuzz)"/>
    <polygon points="110,90 230,70 300,150 270,240 170,275 95,215" fill="#c0392b" fill-opacity="0.12" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="8 6"/>
    <text x="150" y="180" font-size="15" font-weight="600" fill="#7a1f16">Kingdom</text>
    <text x="150" y="198" font-size="11" fill="#7a1f16">approximate border</text>
  </g>
  <rect x="10" y="40" width="360" height="300" fill="none" stroke="#bbb"/>
  <text x="10" y="362" font-size="12" fill="#444">One flag on the area: dashed line plus a soft band all round.</text>
  <text x="10" y="380" font-size="12" fill="#444">Says "roughly this shape", nothing more. Least work to enter.</text>

  <!-- ===== Panel 2: certain core + possible extent ===== -->
  <text x="390" y="26" font-size="16" font-weight="700" fill="#222">2. Certain core + largest possible extent</text>
  <g clip-path="url(#p2)">
    <rect x="390" y="40" width="360" height="300" fill="#e8e2d0"/>
    <path d="M680,40 C665,130 700,210 675,340 L750,340 L750,40 Z" fill="#a9c7e8"/>
    <polyline points="440,40 465,120 450,200 475,340" fill="none" stroke="#6fa3d8" stroke-width="3"/>
    <!-- outer: largest possible extent -->
    <polygon points="450,80 610,55 690,140 665,255 540,295 445,230" fill="#c0392b" fill-opacity="0.08" stroke="#c0392b" stroke-width="2" stroke-dasharray="8 6"/>
    <!-- inner: certain core -->
    <polygon points="500,120 600,105 650,165 630,225 550,245 490,195" fill="#c0392b" fill-opacity="0.28" stroke="#c0392b" stroke-width="2.5"/>
    <text x="528" y="172" font-size="14" font-weight="600" fill="#7a1f16">certain core</text>
    <text x="455" y="282" font-size="11" fill="#7a1f16">largest possible extent</text>
  </g>
  <rect x="390" y="40" width="360" height="300" fill="none" stroke="#bbb"/>
  <text x="390" y="362" font-size="12" fill="#444">Two outlines, like earliest and latest for a date: solid inner shape</text>
  <text x="390" y="380" font-size="12" fill="#444">is sure, dashed outer shape is the furthest it might reach.</text>

  <!-- ===== Panel 3: edge by edge ===== -->
  <text x="770" y="26" font-size="16" font-weight="700" fill="#222">3. Edge by edge: firm edges and rough edges</text>
  <g clip-path="url(#p3)">
    <rect x="770" y="40" width="360" height="300" fill="#e8e2d0"/>
    <path d="M1060,40 C1045,130 1080,210 1055,340 L1130,340 L1130,40 Z" fill="#a9c7e8"/>
    <polyline points="820,40 845,120 830,200 855,340" fill="none" stroke="#6fa3d8" stroke-width="3"/>
    <!-- fill of the whole area -->
    <polygon points="845,120 950,75 1058,125 1066,235 960,285 830,200" fill="#c0392b" fill-opacity="0.12"/>
    <!-- rough edges: dashed with fuzz -->
    <polyline points="845,120 950,75 1058,125" fill="none" stroke="#c0392b" stroke-width="22" opacity="0.22" filter="url(#fuzz)"/>
    <polyline points="845,120 950,75 1058,125" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="8 6"/>
    <polyline points="1066,235 960,285 830,200" fill="none" stroke="#c0392b" stroke-width="22" opacity="0.22" filter="url(#fuzz)"/>
    <polyline points="1066,235 960,285 830,200" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="8 6"/>
    <!-- firm edges: solid, following the coast and the river -->
    <path d="M1058,125 C1054,160 1070,200 1066,235" fill="none" stroke="#c0392b" stroke-width="4"/>
    <polyline points="830,200 845,120" fill="none" stroke="#c0392b" stroke-width="4"/>
    <text x="900" y="170" font-size="14" font-weight="600" fill="#7a1f16">Kingdom</text>
    <text x="1004" y="190" font-size="11" fill="#7a1f16" transform="rotate(84 1004 190)">firm: coast</text>
    <text x="790" y="165" font-size="11" fill="#7a1f16" transform="rotate(-78 790 165)">firm: river</text>
    <text x="930" y="62" font-size="11" fill="#7a1f16">rough</text>
    <text x="930" y="310" font-size="11" fill="#7a1f16">rough</text>
  </g>
  <rect x="770" y="40" width="360" height="300" fill="none" stroke="#bbb"/>
  <text x="770" y="362" font-size="12" fill="#444">Each edge marked separately: solid where a coast, river or treaty</text>
  <text x="770" y="380" font-size="12" fill="#444">line fixes it, dashed with a band where it is a guess.</text>
</svg>
